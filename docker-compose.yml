# Aplicação completa: PostgreSQL + API (NestJS) + interface web (Angular servida por nginx).
# As credenciais vêm do arquivo .env (veja .env.example). Suba tudo com:  docker compose up -d --build

services:
  banco:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?defina DB_USER no .env}
      POSTGRES_PASSWORD: ${DB_SENHA:?defina DB_SENHA no .env}
      POSTGRES_DB: ${DB_NOME:-emprestimo_equipamentos}
    volumes:
      - dados_banco:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [rede]
    # Sem "ports": o banco NÃO é exposto fora do Docker. Só a API o alcança.

  # Serviço de uso único: aplica as migrations (e cria o 1º administrador) e termina.
  migrar:
    build:
      context: ./backend
      target: migracao
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_SENHA}@banco:5432/${DB_NOME:-emprestimo_equipamentos}?schema=public
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_SENHA: ${ADMIN_SENHA:-}
      ADMIN_NOME: ${ADMIN_NOME:-Administrador}
    depends_on:
      banco:
        condition: service_healthy
    restart: 'no'
    networks: [rede]

  api:
    build:
      context: ./backend
      target: producao
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER}:${DB_SENHA}@banco:5432/${DB_NOME:-emprestimo_equipamentos}?schema=public
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env (mínimo 32 caracteres)}
      JWT_EXPIRA_EM: ${JWT_EXPIRA_EM:-15m}
      REFRESH_DIAS: ${REFRESH_DIAS:-7}
      CORS_ORIGENS: ${CORS_ORIGENS:-}
      SWAGGER_ATIVO: ${SWAGGER_ATIVO:-false}
      METRICAS_TOKEN: ${METRICAS_TOKEN:-}
      # A API fica atrás do nginx (1 proxy): o IP do cliente vem do X-Forwarded-For, e o limite de tentativas é por pessoa
      TRUST_PROXY: 1
      # Recuperação de senha por e-mail. APP_URL é o endereço público da interface (vai nos links dos e-mails).
      # Sem SMTP_HOST os e-mails NÃO são enviados (em produção o conteúdo nunca vai para o log).
      APP_URL: '${APP_URL:?defina APP_URL no .env (ex.: https://app.exemplo.com)}'
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORTA: ${SMTP_PORTA:-587}
      SMTP_SEGURO: ${SMTP_SEGURO:-false}
      SMTP_USUARIO: ${SMTP_USUARIO:-}
      SMTP_SENHA: ${SMTP_SENHA:-}
      # Limites de requisição: vazio = o padrão de produção. Só suba em ambiente de TESTE (suíte de interface)
      LIMITE_LOGIN_POR_MINUTO: ${LIMITE_LOGIN_POR_MINUTO:-}
      LIMITE_GERAL_POR_MINUTO: ${LIMITE_GERAL_POR_MINUTO:-}
      LIMITE_CADASTRO_POR_HORA: ${LIMITE_CADASTRO_POR_HORA:-}
      LIMITE_RECUPERACAO_POR_HORA: ${LIMITE_RECUPERACAO_POR_HORA:-}
      LIMITE_REDEFINICAO_POR_HORA: ${LIMITE_REDEFINICAO_POR_HORA:-}
      # Cookie da sessão com o atributo Secure (só HTTPS). Vazio = ligado em produção. COOKIE_SEGURO=false só para
      # testar a stack em http fora de localhost: em produção real use HTTPS e deixe em branco
      COOKIE_SEGURO: ${COOKIE_SEGURO:-}
      CADASTRO_PUBLICO: ${CADASTRO_PUBLICO:-true}
      NOTIFICACOES_ATIVAS: ${NOTIFICACOES_ATIVAS:-true}
      NOTIFICACOES_CRON: '${NOTIFICACOES_CRON:-0 8 * * *}'
      NOTIFICACOES_FUSO: ${NOTIFICACOES_FUSO:-America/Sao_Paulo}
      EMAIL_REMETENTE: '${EMAIL_REMETENTE:-Equipment loan <nao-responda@localhost>}'
    depends_on:
      migrar:
        condition: service_completed_successfully
    ports:
      # Somente localhost: publique atrás de um proxy reverso com HTTPS (veja docs/deploy.md)
      - '127.0.0.1:${PORTA_API:-3000}:3000'
    healthcheck:
      # A imagem só tem node: usa o fetch nativo para chamar a rota de saúde
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/saude').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    security_opt:
      - no-new-privileges:true
    networks: [rede]

  # Interface web: arquivos estáticos do Angular + proxy de /api para a API (mesma origem: sem CORS no navegador).
  web:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Somente localhost: publique atrás de um proxy reverso com HTTPS (veja docs/deploy.md)
      - '127.0.0.1:${PORTA_WEB:-8080}:8080'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/saude-web']
      interval: 15s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    networks: [rede]

  # Backup diário do banco (às 03:00, mantém 14 dias). Os arquivos vão para a pasta BACKUP_PASTA do servidor:
  # copie-a para FORA da máquina. Restaurar: scripts/restaurar-banco.sh. Veja docs/deploy.md.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      banco:
        condition: service_healthy
    entrypoint: ['sh', '/backup-agendado.sh']
    environment:
      PGHOST: banco
      PGUSER: ${DB_USER:?defina DB_USER no .env}
      PGPASSWORD: ${DB_SENHA:?defina DB_SENHA no .env}
      PGDATABASE: ${DB_NOME:-emprestimo_equipamentos}
      TZ: ${TZ:-America/Sao_Paulo}
      BACKUP_HORA: ${BACKUP_HORA:-03:00}
      BACKUP_MANTER_DIAS: ${BACKUP_MANTER_DIAS:-14}
      BACKUP_AO_INICIAR: ${BACKUP_AO_INICIAR:-false}
      BACKUP_AVISO_OK: ${BACKUP_AVISO_OK:-}
    volumes:
      - ./scripts/backup-agendado.sh:/backup-agendado.sh:ro
      - ${BACKUP_PASTA:-./backups}:/backups
    security_opt:
      - no-new-privileges:true
    networks: [rede]

  # Só para desenvolvimento (docker compose --profile dev up -d): caixa de entrada de teste. Nenhum e-mail sai de
  # verdade; veja os que a aplicação enviaria em http://localhost:8025. Use SMTP_HOST=mailpit e SMTP_PORTA=1025.
  mailpit:
    image: axllent/mailpit:v1.31
    profiles: [dev]
    restart: unless-stopped
    ports:
      - '127.0.0.1:${PORTA_MAILPIT:-8025}:8025'
    networks: [rede]

networks:
  rede:

volumes:
  dados_banco:
