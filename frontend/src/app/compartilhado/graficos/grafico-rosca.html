<div class="rosca">
  <svg viewBox="0 0 42 42" role="img" [attr.aria-label]="resumo()">
    <circle class="fundo" cx="21" cy="21" r="15.9155" />
    @for (s of segmentos(); track s.rotulo) {
      @if (s.pct > 0) {
        <circle
          class="fatia"
          cx="21"
          cy="21"
          r="15.9155"
          [attr.stroke-dasharray]="s.dasharray"
          [attr.stroke-dashoffset]="s.deslocamento"
          [style.stroke]="s.cor"
        />
      }
    }
    <text class="numero" x="21" y="21.5" text-anchor="middle">{{ total() }}</text>
    <text class="rotulo" x="21" y="26.5" text-anchor="middle">{{ rotuloCentro() }}</text>
  </svg>

  <ul class="legenda">
    @for (s of segmentos(); track s.rotulo) {
      <li>
        <i class="cor" [style.background]="s.cor"></i>
        <span class="nome">{{ s.rotulo }}</span>
        <strong>{{ s.valor }}</strong>
        <span class="pct">{{ s.pct.toFixed(0) }}%</span>
      </li>
    }
  </ul>
</div>
