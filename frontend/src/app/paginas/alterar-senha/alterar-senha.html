<form [formGroup]="form" (ngSubmit)="salvar()" novalidate>
  <p class="aviso-sessao">
    Ao confirmar, todas as suas sessões serão encerradas e você entrará de novo.
  </p>

  @if (erro(); as mensagem) {
    <div class="alerta erro" role="alert">{{ mensagem }}</div>
  }

  <div class="campo">
    <label for="senhaAtual">Senha atual</label>
    <input
      id="senhaAtual"
      type="password"
      formControlName="senhaAtual"
      autocomplete="current-password"
      [attr.aria-invalid]="form.controls.senhaAtual.touched && form.controls.senhaAtual.invalid"
    />
    <app-erro-campo
      [controle]="form.controls.senhaAtual"
      rotulo="senha atual"
      [mensagens]="{ required: 'Informe a senha atual.' }"
    />
  </div>

  <div class="campo">
    <label for="novaSenha">Nova senha</label>
    <input
      id="novaSenha"
      type="password"
      formControlName="novaSenha"
      autocomplete="new-password"
      [attr.aria-invalid]="form.controls.novaSenha.touched && form.controls.novaSenha.invalid"
    />
    <app-erro-campo
      [controle]="form.controls.novaSenha"
      rotulo="nova senha"
      [mensagens]="{ required: 'Escolha a nova senha.' }"
      [ignorar]="['minlength', 'maxlength', 'pattern']"
    />
    <app-regras-senha [controle]="form.controls.novaSenha" />
    @if (form.controls.novaSenha.touched && form.hasError('igualAtual')) {
      <span class="erro-campo">A nova senha precisa ser diferente da atual.</span>
    }
  </div>

  <div class="acoes">
    <button class="botao" type="submit" [disabled]="enviando()">
      {{ enviando() ? 'Salvando...' : 'Alterar senha' }}
    </button>
  </div>
</form>
