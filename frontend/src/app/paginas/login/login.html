<main class="pagina">
  <form class="cartao" [formGroup]="form" (ngSubmit)="entrar()" novalidate>
    <app-logo class="logo-login" [tamanho]="56" />
    <h1>Equipment loan</h1>
    <p class="subtitulo">Entre com seu e-mail e senha.</p>

    @if (erro(); as mensagem) {
      <div class="alerta erro" role="alert">{{ mensagem }}</div>
    }

    <div class="campo">
      <label for="email">E-mail</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        autocomplete="username"
        [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid"
      />
      <app-erro-campo
        [controle]="form.controls.email"
        rotulo="e-mail"
        [mensagens]="{ required: 'Informe o e-mail.' }"
      />
    </div>

    <div class="campo">
      <label for="senha">Senha</label>
      <input
        id="senha"
        type="password"
        formControlName="senha"
        autocomplete="current-password"
        [attr.aria-invalid]="form.controls.senha.touched && form.controls.senha.invalid"
      />
      <app-erro-campo
        [controle]="form.controls.senha"
        rotulo="senha"
        [mensagens]="{ required: 'Informe a senha.' }"
      />
    </div>

    <button class="botao" type="submit" [disabled]="enviando()">
      {{ enviando() ? 'Entrando...' : 'Entrar' }}
    </button>

    <p class="esqueci"><a routerLink="/esqueci-senha">Esqueci minha senha</a></p>
    @if (cadastroAberto()) {
      <p class="esqueci">Ainda não tem conta? <a routerLink="/registro">Criar conta</a></p>
    }
  </form>
</main>
