server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # A API (o "/api" é removido antes de chegar nela: /api/v1/... vira /v1/...). Os cabeçalhos de segurança dela
  # (helmet) passam direto.
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_http_version 1.1;
    # O cookie da sessão nasce com Path=/v1/auth (rota da API); para o navegador o caminho é /api/v1/auth
    proxy_cookie_path /v1/auth /api/v1/auth;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Acrescenta o IP de quem chegou ao final da lista. A API só confia nos N últimos itens (TRUST_PROXY), então um
    # valor forjado pelo cliente no início da lista é ignorado.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 256k; # avatares pequenos; nada de uploads grandes
  }

  # Rota de saúde do próprio nginx (usada pelo healthcheck do Docker)
  location = /saude-web {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # Arquivos com hash no nome nunca mudam: cache longo
  location ~* \.(?:js|css|svg|woff2?|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/cabecalhos.conf;
    try_files $uri =404;
  }

  # Aplicação de página única: qualquer rota do Angular devolve o index.html (sem cache, para pegar versões novas)
  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/cabecalhos.conf;
    try_files $uri $uri/ /index.html;
  }
}
