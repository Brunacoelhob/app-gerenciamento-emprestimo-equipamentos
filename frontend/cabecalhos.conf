# Cabeçalhos de segurança. Incluído em cada "location" que usa add_header (no nginx, um add_header dentro de um
# "location" descarta os herdados do nível acima).
#
# A política de conteúdo (CSP) está em modo "somente relatório": não bloqueia nada (o VLibras, de terceiros, precisa
# de permissões que ainda não foram testadas) e mostra no console do navegador o que seria bloqueado. Depois de
# ajustada, troque por "Content-Security-Policy".
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://viacep.com.br; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
