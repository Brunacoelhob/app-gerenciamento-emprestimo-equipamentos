# Cabeçalhos de segurança. Incluído em cada "location" que usa add_header (no nginx, um add_header dentro de um
# "location" descarta os herdados do nível acima).
#
# Política de conteúdo (CSP) em modo BLOQUEIO. Scripts só do próprio site e do VLibras (tradução para Libras do
# governo federal, ligada pelo botão da barra de acessibilidade); nenhum script inline. "style-src 'unsafe-inline'"
# existe porque o Angular injeta os estilos dos componentes em tempo de execução: é o único afrouxamento.
# As origens do VLibras foram medidas no navegador (imagens, fontes, script, iframe e a API de tradução). O domínio dele
# redireciona os arquivos para cdn.jsdelivr.net, por isso as duas origens aparecem. Se um dia
# o plugin passar a usar outra origem, ele quebra aqui: veja o console do navegador (violações de CSP) e ajuste.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://vlibras.gov.br https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://vlibras.gov.br https://cdn.jsdelivr.net; font-src 'self' https://vlibras.gov.br https://cdn.jsdelivr.net; connect-src 'self' https://viacep.com.br https://vlibras.gov.br https://traducao2.vlibras.gov.br; frame-src https://vlibras.gov.br; worker-src 'self' blob:; media-src 'self' blob: https://vlibras.gov.br https://cdn.jsdelivr.net; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
