name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancela execuções antigas da mesma branch quando chega um push novo
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Backend - lint, tipos, testes unitários e de integração
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Banco real só para os testes de integração (nunca o de desenvolvimento)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: emprestimo_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d emprestimo_teste"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/emprestimo_teste?schema=public
      DATABASE_URL_TESTE: postgresql://postgres:postgres@127.0.0.1:5432/emprestimo_teste?schema=public
      JWT_SECRET: segredo-de-ci-com-mais-de-32-caracteres-xxxxxxxx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24' # o Jest só carrega os pacotes ESM do Nest 12 no Node 24.9+
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Checagem de tipos
        run: npx tsc --noEmit
      - name: Testes unitários
        run: npm test
      - name: Testes de integração (API inteira + PostgreSQL)
        run: npm run test:e2e
      - name: Build
        run: npm run build

  seguranca:
    name: Segurança - vulnerabilidades conhecidas nas dependências
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - pasta: backend
            # Há 4 avisos "altos" só em dependências indiretas da CLI do Prisma (deepmerge-ts, mysql2), que não rodam
            # na API e cujo conserto automático (--force) troca versões do Prisma. Revisar a cada atualização dele.
            nivel: critical
          - pasta: frontend
            nivel: high
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # Só o que vai para produção (omit=dev)
      - name: npm audit
        working-directory: ${{ matrix.pasta }}
        run: npm audit --omit=dev --audit-level=${{ matrix.nivel }}

  frontend:
    name: Frontend - testes e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Testes
        run: npx ng test --watch=false
      - name: Build
        run: npm run build

  docker:
    name: Imagens Docker e compose
    runs-on: ubuntu-latest
    needs: qualidade
    env:
      DB_USER: postgres
      DB_SENHA: ci
      JWT_SECRET: segredo-de-ci-com-mais-de-32-caracteres-xxxxxxxx
      APP_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - name: Valida o docker-compose
        run: docker compose config -q
      - name: Constrói as imagens
        run: docker compose build
      - name: Sobe a stack e confere a saúde da API
        run: |
          docker compose up -d
          for i in $(seq 1 40); do
            [ "$(docker compose ps api --format '{{.Health}}')" = "healthy" ] && break
            sleep 3
          done
          for i in $(seq 1 40); do
            [ "$(docker compose ps web --format '{{.Health}}')" = "healthy" ] && break
            sleep 3
          done
          docker compose ps
          curl --fail --silent http://127.0.0.1:3000/saude
          echo
          # A interface web: a página, uma rota do Angular e a API pelo proxy do nginx
          curl --fail --silent --output /dev/null http://127.0.0.1:8080/
          curl --fail --silent --output /dev/null http://127.0.0.1:8080/perfil
          curl --fail --silent http://127.0.0.1:8080/api/saude
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs

  interface:
    name: Testes de interface (Playwright)
    runs-on: ubuntu-latest
    needs: qualidade
    env:
      DB_USER: postgres
      DB_SENHA: ci
      JWT_SECRET: segredo-de-ci-com-mais-de-32-caracteres-xxxxxxxx
      APP_URL: http://127.0.0.1:8080
      ADMIN_EMAIL: admin@e2e.teste.com
      ADMIN_SENHA: SenhaAdminE2E12345
      # E-mails de teste vão para o Mailpit (nada sai de verdade)
      SMTP_HOST: mailpit
      SMTP_PORTA: 1025
      # Só neste ambiente de teste: a suíte faz dezenas de logins do mesmo IP
      LIMITE_LOGIN_POR_MINUTO: 100000
      LIMITE_GERAL_POR_MINUTO: 100000
      LIMITE_CADASTRO_POR_HORA: 100000
      LIMITE_RECUPERACAO_POR_HORA: 100000
      LIMITE_REDEFINICAO_POR_HORA: 100000
    steps:
      - uses: actions/checkout@v4
      - name: Sobe a aplicação inteira (com o Mailpit)
        run: |
          docker compose --profile dev up -d --build
          for i in $(seq 1 60); do
            [ "$(docker compose ps web --format '{{.Health}}')" = "healthy" ] && break
            sleep 3
          done
          docker compose ps
          curl --fail --silent http://127.0.0.1:8080/api/saude
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Instala o Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Roda os testes de interface
        working-directory: e2e
        env:
          E2E_URL: http://127.0.0.1:8080
          E2E_ADMIN_EMAIL: admin@e2e.teste.com
          E2E_ADMIN_SENHA: SenhaAdminE2E12345
          E2E_MAILPIT: http://127.0.0.1:8025
          E2E_SEM_INTERNET: '1' # o VLibras depende de um serviço externo: fora do CI para não deixá-lo instável
        run: npx playwright test
      - name: Relatório e vídeos em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-playwright
          path: |
            e2e/playwright-report
            e2e/test-results
      - name: Logs da aplicação em caso de falha
        if: failure()
        run: docker compose logs
